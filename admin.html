<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061a2b">
  <title>Admin DIFTEL | Mensajes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#04111f;--panel:#071827;--panel2:#0a2034;--line:#193b56;--text:#f4f8fb;--muted:#89a4b7;--cyan:#25d4f2;--blue:#1c74ff;--green:#3fe08f;--red:#ff8181}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,rgba(28,116,255,.15),transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
    button,input{font:inherit}.wrap{width:min(1120px,calc(100% - 34px));margin:0 auto;padding:34px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#001522;font-weight:900}.brand strong{display:block}.brand small{display:block;color:var(--muted);margin-top:3px}.secure{padding:8px 11px;border:1px solid rgba(63,224,143,.25);border-radius:999px;color:#9ce8bc;background:rgba(63,224,143,.07);font-size:11px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#081b2c,#061522);border-radius:18px;box-shadow:0 22px 70px rgba(0,0,0,.25)}
    .login{max-width:460px;margin:90px auto 0;padding:28px}.login h1{margin:0 0 8px;font-size:28px}.login p{margin:0 0 22px;color:var(--muted);line-height:1.6;font-size:13px}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:11px;color:#9fb5c5;font-weight:600}.field input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #1a405d;background:var(--panel2);color:white;outline:none}.field input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(37,212,242,.08)}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#001522;width:100%}.secondary{background:#0b2237;color:#d9e6ee;border:1px solid #204967}.danger{background:rgba(255,80,80,.08);border:1px solid rgba(255,100,100,.25);color:#ff9d9d}.feedback{min-height:20px;margin:12px 0 0;font-size:12px;color:#ff9999}
    .dashboard{display:none}.dash-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.dash-head h1{font-size:36px;letter-spacing:-.04em;margin:0}.dash-head p{margin:7px 0 0;color:var(--muted);font-size:13px}.dash-actions{display:flex;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{padding:18px;border:1px solid var(--line);border-radius:14px;background:#071827}.stat small{font:9px JetBrains Mono,monospace;color:#64859a;letter-spacing:.1em}.stat strong{display:block;font-size:26px;margin-top:8px}.messages{display:grid;gap:12px}.msg{padding:18px;border:1px solid var(--line);border-radius:15px;background:#071827}.msg-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.msg strong{font-size:14px}.msg-meta{font:9px JetBrains Mono,monospace;color:#69879c;margin-top:4px}.msg-body{margin:14px 0;color:#c8d6df;line-height:1.6;font-size:13px;white-space:pre-wrap;word-break:break-word}.msg-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.status{padding:6px 9px;border-radius:999px;font-size:10px;border:1px solid #27506b;color:#8eafc2;background:#0c2235}.status.delivered{border-color:rgba(63,224,143,.3);color:#69e8a3;background:rgba(63,224,143,.08)}.empty{padding:38px;text-align:center;color:#7592a6}.hidden{display:none!important}
    @media(max-width:700px){.stats{grid-template-columns:1fr}.dash-head{align-items:flex-start;flex-direction:column}.top{align-items:flex-start}.msg-top{flex-direction:column}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="mark">T</div><div><strong>DIFTEL Admin</strong><small>Panel de mensajería</small></div></div>
      <div class="secure">ACCESO RESTRINGIDO</div>
    </div>

    <section class="card login" id="loginCard">
      <h1>Iniciar sesión</h1>
      <p>Accede con la cuenta administradora configurada en Firebase Authentication.</p>
      <form id="loginForm">
        <div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button class="btn primary" type="submit" id="loginBtn">Ingresar</button>
        <p class="feedback" id="loginFeedback"></p>
      </form>
    </section>

    <section class="dashboard" id="dashboard">
      <div class="dash-head">
        <div><h1>Mensajes recibidos</h1><p>Actualiza el estado de los mensajes almacenados en Realtime Database.</p></div>
        <div class="dash-actions"><button class="btn secondary" id="refreshBtn">Actualizar</button><button class="btn danger" id="logoutBtn">Cerrar sesión</button></div>
      </div>

      <div class="stats">
        <div class="stat"><small>TOTAL</small><strong id="totalStat">0</strong></div>
        <div class="stat"><small>EN TRÁNSITO</small><strong id="transitStat">0</strong></div>
        <div class="stat"><small>ENTREGADOS</small><strong id="deliveredStat">0</strong></div>
      </div>

      <div class="messages" id="messagesList"><div class="empty">Cargando mensajes…</div></div>
    </section>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
